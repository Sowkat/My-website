<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>GlobalTopUp Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;padding:14px;font-family:'Hind Siliguri',sans-serif;background:#0f172a;color:#fff}.hidden{display:none!important}
.login{max-width:400px;margin:60px auto;background:#1e293b;padding:28px;border-radius:16px}.login h2{text-align:center}.input{margin:12px 0}.input label{display:block;margin-bottom:6px}.input input,.control,input,select{width:100%;padding:11px;border-radius:8px;border:1px solid #475569;background:#0b1220;color:#fff}.btn{border:0;border-radius:8px;padding:10px 14px;color:#fff;background:#6366f1;cursor:pointer;font-family:inherit;font-weight:600}.danger{background:#ef4444}.success{background:#10b981}.muted{color:#94a3b8}.error{color:#f87171}.admin{max-width:1500px;margin:auto}.header{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:16px}.header h1{margin:0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tab{background:#1e293b;border:1px solid #334155;color:#fff}.tab.active{background:#6366f1}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:15px}.stat{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:14px}.stat b{font-size:23px;display:block}.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;margin-bottom:12px}.panel{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:14px;margin-bottom:15px}.table-wrap{overflow:auto}table{width:100%;min-width:1150px;border-collapse:collapse}th,td{padding:9px;border:1px solid #334155;text-align:left;font-size:13px}th{background:#6366f1}.status{padding:5px;border-radius:6px}.cards{display:none}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:15px;z-index:50}.modal-box{max-width:650px;width:100%;max-height:90vh;overflow:auto;background:#1e293b;padding:20px;border-radius:14px}.pkg-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.pkg{border:1px solid #334155;padding:12px;border-radius:10px}.pkg-actions{display:flex;gap:6px;margin-top:8px}.notice{position:fixed;right:15px;top:15px;background:#1e293b;border-left:4px solid #10b981;padding:14px;border-radius:10px;z-index:100;box-shadow:0 10px 30px #0008}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}.table-wrap{display:none}.cards{display:block}.order-card{background:#172235;border:1px solid #334155;border-radius:12px;margin-bottom:10px;padding:13px}.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid #334155}.row:last-child{border:0}.pkg-grid{grid-template-columns:1fr}}
@media(max-width:500px){body{padding:8px}.header{flex-direction:column;align-items:stretch}.header .btn{width:100%}.stats{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr}.tabs .tab{flex:1}}
</style></head><body>
<div id="noticeBox"></div>
<div id="login" class="login"><h2>🔐 Admin Login</h2><div class="input"><label>Email</label><input id="email" type="email"></div><div class="input"><label>Password</label><input id="password" type="password"></div><button id="loginBtn" class="btn" style="width:100%">Login</button><p id="loginError" class="error"></p></div>
<div id="admin" class="admin hidden">
<div class="header"><div><h1>📊 GlobalTopUp Admin</h1><span id="userEmail" class="muted"></span></div><button id="logout" class="btn danger">Logout</button></div>
<div class="tabs"><button class="btn tab active" data-tab="orders">📦 Orders</button><button class="btn tab" data-tab="packages">🛍 Packages</button><button class="btn tab" data-tab="settings">⚙️ Settings</button></div>

<section id="ordersTab"><div id="stats" class="stats"></div><div class="panel"><div class="toolbar">
<input id="search" placeholder="Order ID / TrxID / Number / Target"><select id="statusFilter"><option value="">সব Status</option><option>Pending (অপেক্ষমাণ)</option><option>Processing (প্রসেস হচ্ছে)</option><option>Completed (সম্পন্ন)</option><option>Cancelled (বাতিল)</option></select><select id="serviceFilter"><option value="">সব সার্ভিস</option></select><input id="dateFilter" type="date"><button id="exportBtn" class="btn success">CSV Export</button></div>
<div class="table-wrap"><table><thead><tr><th>Order</th><th>Service</th><th>Target</th><th>Price</th><th>Payment</th><th>Sender</th><th>TrxID</th><th>Date</th><th>Status</th><th>Action</th></tr></thead><tbody id="orderBody"></tbody></table></div><div id="cards" class="cards"></div></div></section>

<section id="packagesTab" class="hidden"><div class="panel"><h2>📦 Package Management</h2><p class="muted">Firebase /packages-এ প্যাকেজ সংরক্ষণ হবে।</p><button class="btn success" onclick="openPackageModal()">+ নতুন প্যাকেজ</button><div id="packageGrid" class="pkg-grid" style="margin-top:12px"></div></div></section>

<section id="settingsTab" class="hidden"><div class="panel"><h2>💳 Payment & Contact Settings</h2><div class="input"><label>bKash</label><input id="setBkash"></div><div class="input"><label>Nagad</label><input id="setNagad"></div><div class="input"><label>Rocket</label><input id="setRocket"></div><div class="input"><label>WhatsApp number</label><input id="setWhatsapp"></div><div class="input"><label>Facebook Page URL</label><input id="setFacebook"></div><div class="input"><label>Support number</label><input id="setSupport"></div><button class="btn success" id="saveSettings">Save Settings</button></div></section>
</div>

<div id="pkgModal" class="modal hidden"><div class="modal-box"><h2 id="pkgTitle">নতুন প্যাকেজ</h2><input type="hidden" id="pkgKey"><div class="input"><label>Category</label><select id="pkgCat"><option value="ff">Free Fire</option><option value="pubg">PUBG</option><option value="facebook">Facebook</option><option value="youtube">YouTube</option></select></div><div class="input"><label>Package name</label><input id="pkgName"></div><div class="input"><label>Price</label><input id="pkgPrice" type="number" min="0"></div><div><button class="btn success" id="savePkg">Save</button> <button class="btn danger" onclick="closePackageModal()">Cancel</button></div></div></div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCW6uxjJIwb8JorzDJXm9YntKu2vNLuvNU",authDomain:"my-web-8b105.firebaseapp.com",databaseURL:"https://my-web-8b105-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"my-web-8b105",storageBucket:"my-web-8b105.firebasestorage.app",messagingSenderId:"554855600124",appId:"1:554855600124:web:3bcb88dca98908b6d7ec79"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.database();let allOrders={},allPackages={},listener=null,newListener=null;
const statuses=["Pending (অপেক্ষমাণ)","Processing (প্রসেস হচ্ছে)","Completed (সম্পন্ন)","Cancelled (বাতিল)"];
const $=id=>document.getElementById(id), esc=v=>{const d=document.createElement("div");d.textContent=v??"";return d.innerHTML};
function notify(msg){const n=document.createElement("div");n.className="notice";n.innerHTML=esc(msg);$("noticeBox").appendChild(n);setTimeout(()=>n.remove(),4000)}
$("loginBtn").onclick=()=>{const e=$("email").value.trim(),p=$("password").value;$("loginError").textContent="";auth.signInWithEmailAndPassword(e,p).catch(x=>$("loginError").textContent=x.message)};
$("password").onkeydown=e=>{if(e.key==="Enter")$("loginBtn").click()};
$("logout").onclick=()=>auth.signOut();
auth.onAuthStateChanged(u=>{if(u){$("login").classList.add("hidden");$("admin").classList.remove("hidden");$("userEmail").textContent=u.email||"";startOrders();loadPackages();loadSettings()}else{$("login").classList.remove("hidden");$("admin").classList.add("hidden")}});
function startOrders(){if(listener)db.ref("orders").off("value",listener);listener=s=>{allOrders=s.val()||{};renderOrders();updateStats();fillServiceFilter()};db.ref("orders").on("value",listener);if(newListener)db.ref("orders").off("child_added",newListener);let initialized=false,known=new Set;newListener=s=>{if(!initialized){known.add(s.key);return}if(!known.has(s.key)){known.add(s.key);notify("🔔 নতুন অর্ডার: "+(s.val().orderId||s.key));try{new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=").play()}catch(e){}}};db.ref("orders").on("child_added",newListener);setTimeout(()=>initialized=true,1200)}
function updateStats(){const a=Object.values(allOrders),today=new Date().toLocaleDateString("en-CA"),sales=a.filter(x=>x.status==="Completed (সম্পন্ন)"&&String(x.date||"").includes(new Date().toLocaleDateString("bn-BD").split(",")[0])).reduce((s,x)=>s+Number(x.price||0),0);$("stats").innerHTML=[["মোট অর্ডার",a.length],["Pending",a.filter(x=>x.status===statuses[0]).length],["Processing",a.filter(x=>x.status===statuses[1]).length],["Completed",a.filter(x=>x.status===statuses[2]).length],["Sales",sales+" BDT"]].map(x=>`<div class="stat"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join("")}
function fillServiceFilter(){const s=new Set(Object.values(allOrders).map(x=>x.service).filter(Boolean)),el=$("serviceFilter"),cur=el.value;el.innerHTML='<option value="">সব সার্ভিস</option>'+[...s].map(x=>`<option>${esc(x)}</option>`).join("");el.value=cur}
function filtered(){const q=$("search").value.toLowerCase(),st=$("statusFilter").value,sv=$("serviceFilter").value;return Object.entries(allOrders).filter(([k,o])=>{const blob=[k,o.orderId,o.trxId,o.senderNumber,o.target,o.service].join(" ").toLowerCase();return(!q||blob.includes(q))&&(!st||o.status===st)&&(!sv||o.service===sv)})}
function renderOrders(){const rows=filtered();$("orderBody").innerHTML=rows.map(([k,o])=>`<tr><td><b>${esc(o.orderId||k)}</b></td><td>${esc(o.service)}</td><td>${esc(o.target)}</td><td>${esc(o.price||0)} BDT</td><td>${esc(o.paymentMethod)}</td><td>${esc(o.senderNumber)}</td><td>${esc(o.trxId)}</td><td>${esc(o.date)}</td><td><select class="status" data-k="${esc(k)}">${statuses.map(s=>`<option ${s===o.status?"selected":""}>${esc(s)}</option>`).join("")}</select></td><td><button class="btn success" onclick="updateStatus('${k}')">Save</button></td></tr>`).join("")||'<tr><td colspan="10">কোনো অর্ডার পাওয়া যায়নি।</td></tr>';
$("cards").innerHTML=rows.map(([k,o])=>`<div class="order-card"><div class="row"><b>${esc(o.orderId||k)}</b><span>${esc(o.date)}</span></div><div class="row"><span>সার্ভিস</span><b>${esc(o.service)}</b></div><div class="row"><span>Target</span><b>${esc(o.target)}</b></div><div class="row"><span>Price</span><b>${esc(o.price||0)} BDT</b></div><div class="row"><span>TrxID</span><b>${esc(o.trxId)}</b></div><select id="m_${esc(k)}">${statuses.map(s=>`<option ${s===o.status?"selected":""}>${esc(s)}</option>`).join("")}</select><button class="btn success" style="width:100%;margin-top:7px" onclick="updateStatusMobile('${k}')">Status Save</button></div>`).join("")}
async function updateStatus(k){const s=document.querySelector(`select[data-k="${CSS.escape(k)}"]`);if(s){await db.ref("orders/"+k+"/status").set(s.value);notify("Status আপডেট হয়েছে")}}
async function updateStatusMobile(k){await db.ref("orders/"+k+"/status").set($("m_"+k).value);notify("Status আপডেট হয়েছে")}
["search","statusFilter","serviceFilter","dateFilter"].forEach(id=>$(id).addEventListener("input",renderOrders));
$("exportBtn").onclick=()=>{const rows=filtered(),head=["Order ID","Service","Target","Price","Payment","Sender","TrxID","Date","Status"],csv=[head,...rows.map(([k,o])=>[o.orderId||k,o.service,o.target,o.price,o.paymentMethod,o.senderNumber,o.trxId,o.date,o.status])].map(r=>r.map(v=>`"${String(v??"").replaceAll('"','""')}"`).join(",")).join("\\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\\ufeff"+csv],{type:"text/csv;charset=utf-8"}));a.download="orders.csv";a.click()};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");["orders","packages","settings"].forEach(t=>$(t+"Tab").classList.toggle("hidden",b.dataset.tab!==t))});
async function loadPackages(){const s=await db.ref("packages").once("value");allPackages=s.val()||{};renderPackages()}
function renderPackages(){const arr=[];Object.entries(allPackages).forEach(([cat,v])=>Object.entries(v||{}).forEach(([key,p])=>arr.push({cat,key,...p})));$("packageGrid").innerHTML=arr.map(p=>`<div class="pkg"><b>${esc(p.name)}</b><div>${esc(p.cat)} · ${esc(p.price)} BDT</div><div class="pkg-actions"><button class="btn" onclick='editPackage(${JSON.stringify(p)})'>Edit</button><button class="btn danger" onclick="deletePackage('${p.cat}','${p.key}')">Delete</button></div></div>`).join("")||"<p>কোনো Firebase package নেই। নতুন package যোগ করুন।"}
function openPackageModal(p){$("pkgModal").classList.remove("hidden");$("pkgKey").value=p?.key||"";$("pkgCat").value=p?.cat||"ff";$("pkgName").value=p?.name||"";$("pkgPrice").value=p?.price||""}
function closePackageModal(){$("pkgModal").classList.add("hidden")}
function editPackage(p){openPackageModal(p)}
window.openPackageModal=openPackageModal;window.closePackageModal=closePackageModal;window.editPackage=editPackage;
$("savePkg").onclick=async()=>{const cat=$("pkgCat").value,name=$("pkgName").value.trim(),price=Number($("pkgPrice").value),key=$("pkgKey").value||("pkg_"+Date.now());if(!name||price<0)return alert("নাম ও মূল্য দিন");await db.ref("packages/"+cat+"/"+key).set({name,price,active:true});closePackageModal();loadPackages();notify("Package saved")}
window.deletePackage=async(cat,key)=>{if(confirm("এই package delete করবেন?")){await db.ref("packages/"+cat+"/"+key).remove();loadPackages();notify("Package deleted")}};
async function loadSettings(){const s=(await db.ref("settings").once("value")).val()||{};$("setBkash").value=s.paymentNumbers?.bKash||"01700000000";$("setNagad").value=s.paymentNumbers?.Nagad||"01800000000";$("setRocket").value=s.paymentNumbers?.Rocket||"01900000000";$("setWhatsapp").value=s.whatsapp||"8801960174982";$("setFacebook").value=s.facebook||"https://facebook.com";$("setSupport").value=s.support||"01700000000"}
$("saveSettings").onclick=async()=>{await db.ref("settings").set({paymentNumbers:{bKash:$("setBkash").value.trim(),Nagad:$("setNagad").value.trim(),Rocket:$("setRocket").value.trim()},whatsapp:$("setWhatsapp").value.trim(),facebook:$("setFacebook").value.trim(),support:$("setSupport").value.trim()});notify("Settings saved")}
</script></body></html>
